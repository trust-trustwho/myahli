function renderStarRating(rating, centered = false) {
    let stars = '';
    const fullStars = Math.floor(rating);
    const halfStar = rating % 1 !== 0;
    const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
    for(let i=0; i<fullStars; i++) stars += `<i data-lucide="star" class="w-4 h-4 text-yellow-400 fill-current"></i>`;
    if(halfStar) stars += `<i data-lucide="star-half" class="w-4 h-4 text-yellow-400 fill-current"></i>`;
    for(let i=0; i<emptyStars; i++) stars += `<i data-lucide="star" class="w-4 h-4 text-gray-300 dark:text-gray-600"></i>`;
    return `<div class="flex items-center ${centered ? 'justify-center' : ''} gap-1">${stars} <span class="text-sm text-light-secondary-text dark:text-dark-secondary-text ml-1 font-medium">${rating.toFixed(1)}</span></div>`;
}

function filterAndRenderProviders() {
    const container = document.getElementById('provider-list');
    const loadingSpinner = document.getElementById('loading-spinner');
    const emptyState = document.getElementById('empty-state');
    
    loadingSpinner.style.display = 'block';
    container.innerHTML = '';
    emptyState.style.display = 'none';

    setTimeout(() => {
        const { selectedCity, activeCategory, searchTerm } = state;
        let filtered = mockData.providers.filter(p => p.city === selectedCity);

        if (activeCategory) {
            filtered = filtered.filter(p => p.categoryName === activeCategory);
        }

        if (searchTerm) {
            const lowercasedTerm = searchTerm.toLowerCase();
            filtered = filtered.filter(p =>
                p.full_name.toLowerCase().includes(lowercasedTerm) ||
                p.primary_skill.toLowerCase().includes(lowercasedTerm)
            );
        }
        
        loadingSpinner.style.display = 'none';
        renderProviders(filtered);
    }, 300); // Simulate network delay
}

function renderChatList() {
    const container = document.getElementById('chat-list-content');
    const userConversations = mockData.conversations
        .filter(c => c.participant_ids.includes(state.currentUserId))
        .sort((a, b) => b.last_message_timestamp - a.last_message_timestamp);
    
    if (userConversations.length === 0) {
        container.innerHTML = `<div class="text-center p-8">
            <i data-lucide="message-square-off" class="mx-auto w-16 h-16 text-light-secondary-text dark:text-dark-secondary-text mb-4"></i>
            <p class="text-light-secondary-text dark:text-dark-secondary-text">Anda belum memiliki percakapan.</p>
        </div>`;
    } else {
        container.innerHTML = userConversations.map(convo => {
            const otherParticipantId = convo.participant_ids.find(id => id !== state.currentUserId);
            const otherParticipant = mockData.providers.find(p => p.provider_id === otherParticipantId);
            const lastMessage = mockData.messages
                .filter(m => m.conversation_id === convo.conversation_id)
                .sort((a, b) => b.timestamp - a.timestamp)[0];

            const lastMessageTime = lastMessage ? lastMessage.timestamp.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '';
            const lastMessageText = lastMessage ? lastMessage.text : 'Belum ada pesan';

            return `
                <div class="p-4 flex items-center gap-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50" onclick="navigateTo('chat-detail-screen', { conversationId: ${convo.conversation_id} })">
                    <img src="${otherParticipant.profile_picture_url}" alt="${otherParticipant.full_name}" class="w-12 h-12 rounded-full object-cover">
                    <div class="flex-grow overflow-hidden">
                        <div class="flex justify-between items-center">
                            <h3 class="font-poppins font-bold truncate">${otherParticipant.full_name}</h3>
                            <p class="text-xs text-light-secondary-text dark:text-dark-secondary-text flex-shrink-0">${lastMessageTime}</p>
                        </div>
                        <p class="text-sm text-light-secondary-text dark:text-dark-secondary-text truncate">${lastMessageText}</p>
                    </div>
                </div>
            `;
        }).join('');
    }
    lucide.createIcons();
}

function renderChatDetail(conversationId) {
    const messages = mockData.messages
        .filter(m => m.conversation_id === conversationId)
        .sort((a, b) => a.timestamp - b.timestamp);
    const container = document.getElementById('chat-detail-messages');
    
    container.innerHTML = messages.map(msg => {
        const isSentByUser = msg.sender_id === state.currentUserId;
        return `
            <div class="flex ${isSentByUser ? 'justify-end' : 'justify-start'}">
                <div class="max-w-xs md:max-w-md p-3 rounded-2xl ${isSentByUser ? 'bg-light-accent-green text-white rounded-br-lg' : 'bg-light-card dark:bg-dark-card rounded-bl-lg'}">
                    <p class="text-sm">${msg.text}</p>
                    <p class="text-xs opacity-70 mt-1 text-right">${msg.timestamp.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</p>
                </div>
            </div>
        `;
    }).join('');
    container.scrollTop = container.scrollHeight;
}

    }
}

function navigateTo(screenId, params = {}, isGoingBack = false) {
    if (params.userName) {
        state.userName = params.userName;
    }
    if (!isGoingBack && state.currentScreen !== 'splash-screen') {
        state.navigationHistory.push({ screen: state.currentScreen, params: state.currentParams });
    }
    state.currentParams = params;

    const appContentShell = document.getElementById('app-content-shell');
    const createProfileFab = document.getElementById('create-profile-fab');
    const screensWithHeader = ['home-screen', 'profile-detail-screen', 'notification-screen', 'profile-edit-screen', 'chat-list-screen', 'chat-detail-screen'];
    
    if (screensWithHeader.includes(screenId)) {
        appContentShell.style.display = 'flex';
        updateHeader(screenId, params);
        if (screenId === 'profile-detail-screen') renderProfileDetail(params.providerId);
        if (screenId === 'notification-screen') renderNotifications();
        if (screenId === 'profile-edit-screen') setupEditProfileForm(params.providerId);
        if (screenId === 'chat-list-screen') renderChatList();
        if (screenId === 'chat-detail-screen') {
            renderChatDetail(params.conversationId);
            const sendBtn = document.getElementById('send-chat-button');
            const chatInput = document.getElementById('chat-input');
            // Clone and replace to remove old event listeners
            const newSendBtn = sendBtn.cloneNode(true);
            sendBtn.parentNode.replaceChild(newSendBtn, sendBtn);
            newSendBtn.addEventListener('click', () => sendMessage(params.conversationId));
            chatInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(params.conversationId); };
        }
    } else {
        appContentShell.style.display = 'none';
    }

    // Toggle FAB visibility
    if (screenId === 'home-screen') {
        createProfileFab.style.display = 'block';
    } else {
        createProfileFab.style.display = 'none';
    }

    showScreen(screenId);
    lucide.createIcons();
}

function goBack() {
    const lastState = state.navigationHistory.pop();
    if (lastState) {
        navigateTo(lastState.screen, lastState.params, true);
    }
}

function handleNotificationClick(id) {
    const notif = mockData.notifications.find(n => n.notification_id === id);
    if (notif) {
        notif.is_read = true;
        if (notif.link_target && notif.link_target !== '#') {
            const [screen, targetId] = notif.link_target.split(':');
            if (screen && targetId) {
                let params = {};
                if (screen === 'chat-detail-screen') {
                    const convo = mockData.conversations.find(c => c.conversation_id === parseInt(targetId));
                    // A bit of a hack for mock data: find the conversation with the right provider
                    if(convo) {
                         params = { conversationId: convo.conversation_id };
                    } else {
                        // If no direct conversation ID, maybe targetID is a provider ID.
                        const providerId = parseInt(targetId);
                        let conversation = mockData.conversations.find(c => c.participant_ids.includes(providerId) && c.participant_ids.includes(state.currentUserId));
                        if(conversation) {
                            params = { conversationId: conversation.conversation_id };
                        } else {
                             // Fallback or create new
                            startOrOpenChat(providerId);
                            return;
                        }
                    }
                } else {
                    params = { providerId: parseInt(targetId) };
                }
                navigateTo(screen, params);
            }
        } else {
            renderNotifications(); // Re-render to show read state
        }
    }
}

// ===== CHAT LOGIC =====
function startOrOpenChat(providerId) {
    let conversation = mockData.conversations.find(c =>
        c.participant_ids.includes(state.currentUserId) && c.participant_ids.includes(providerId)
    );

    if (!conversation) {
        // Create a new conversation if it doesn't exist
        const newConversationId = Math.max(...mockData.conversations.map(c => c.conversation_id)) + 1;
        conversation = {
            conversation_id: newConversationId,
            participant_ids: [state.currentUserId, providerId],
            last_message_timestamp: new Date()
        };
        mockData.conversations.push(conversation);
    }
    
    navigateTo('chat-detail-screen', { conversationId: conversation.conversation_id });
}

function sendMessage(conversationId) {
    const chatInput = document.getElementById('chat-input');
    const text = chatInput.value.trim();
    if (text === '') return;

    const newMessage = {
        message_id: Math.random(),
        conversation_id: conversationId,
        sender_id: state.currentUserId,
        text: text,
        timestamp: new Date()
    };
    mockData.messages.push(newMessage);
    
    // Update last message timestamp
    const convo = mockData.conversations.find(c => c.conversation_id === conversationId);
    if(convo) convo.last_message_timestamp = new Date();

    chatInput.value = '';
    renderChatDetail(conversationId);
}

// ===== CITY MODAL LOGIC =====
function openCityModal() {
    const modal = document.getElementById('city-modal');
    const cityListContainer = document.getElementById('city-list-modal');
    
    cityListContainer.innerHTML = mockData.cities.map(city => `
        <div class="city-option p-3 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 flex justify-between items-center" data-city="${city}">
            <span>${city}</span>
            ${state.selectedCity === city ? '<i data-lucide="check" class="w-5 h-5 text-light-accent-green dark:text-dark-accent-green"></i>' : ''}
        </div>
    `).join('');

    modal.style.display = 'flex';
    lucide.createIcons();

    document.querySelectorAll('.city-option').forEach(option => {
        option.addEventListener('click', (e) => {
            const newCity = e.currentTarget.dataset.city;
            state.selectedCity = newCity;
            
            // Update UI
            document.getElementById('city-display').textContent = newCity;
            document.getElementById('search-bar').placeholder = `Cari layanan di ${newCity}...`;
            // Reset filters when changing city
            state.activeCategory = null;
            state.searchTerm = '';
            document.getElementById('search-bar').value = '';
            updateCategoryUI();
            filterAndRenderProviders();
            
            closeCityModal();
        });
    });
}

function closeCityModal() {
    document.getElementById('city-modal').style.display = 'none';
}

function updateCategoryUI() {
    document.querySelectorAll('#category-list .category-item').forEach(item => {
        const itemCategory = item.dataset.category;
        // Highlight "Semua" if no category is active, or the specific category if it is active
        if ((itemCategory === 'Semua' && state.activeCategory === null) || itemCategory === state.activeCategory) {
            item.classList.add('active-category');
        } else {
            item.classList.remove('active-category');
        }
    });
}


// ===== INITIALIZATION =====
document.addEventListener('DOMContentLoaded', () => {
    // A more robust way to handle theme switching
    const setupTheme = () => {
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        if (!themeToggleBtn) return; // safety check
        const rootHtml = document.documentElement;

        const applyTheme = (theme) => {
            if (theme === 'dark') {
                rootHtml.classList.add('dark');
                themeToggleBtn.innerHTML = '<i data-lucide="moon"></i>'; // Re-create the icon element
            } else {
                rootHtml.classList.remove('dark');
                themeToggleBtn.innerHTML = '<i data-lucide="sun"></i>'; // Re-create the icon element
            }
            lucide.createIcons(); // Re-render the newly created icon
        };

        const toggleTheme = () => {
            const newTheme = rootHtml.classList.contains('dark') ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        };

        // Set initial theme based on localStorage or system preference
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

        // Attach event listener to the stable button wrapper
        themeToggleBtn.addEventListener('click', toggleTheme);
    };
    
    setupTheme();

    document.getElementById('close-modal-btn').addEventListener('click', closeCityModal);
    document.getElementById('modal-overlay').addEventListener('click', closeCityModal);

    // Search and Filter Listeners
    document.getElementById('search-bar').addEventListener('input', (e) => {
        state.searchTerm = e.target.value;
        filterAndRenderProviders();
    });

    const categoryList = document.getElementById('category-list');
    categoryList.addEventListener('click', (e) => {
        const categoryItem = e.target.closest('.category-item');
        if (categoryItem) {
            const categoryName = categoryItem.dataset.category;
            if (categoryName === 'Semua') {
                state.activeCategory = null;
            } else {
                // Toggle functionality
                state.activeCategory = state.activeCategory === categoryName ? null : categoryName;
            }
            updateCategoryUI();
            filterAndRenderProviders();
        }
    });

    const splashScreen = document.getElementById('splash-screen');
    const loginScreen = document.getElementById('login-screen');

    // Start fade out animation after a delay
    setTimeout(() => {
        splashScreen.classList.remove('animate-splash-fade');
        splashScreen.classList.add('animate-splash-fade-out');
    }, 2000);

    // After animation is guaranteed to be finished, switch screens
    setTimeout(() => {
        splashScreen.classList.remove('active');
        loginScreen.classList.add('active');
        state.currentScreen = 'login-screen';
        lucide.createIcons();
    }, 3500); // 2000ms wait + 1500ms animation

    renderCategories();
    filterAndRenderProviders();
    updateCategoryUI(); // Ensure "Semua" is active on initial load
    lucide.createIcons();
});
</script>
